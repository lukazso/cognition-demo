[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-core"
version = "0.1.0"
description = "Shared platform for governed internal tools: auth, actions, audit, connectors, db, http, testing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
    "import-linter>=2",
]

[tool.setuptools.packages.find]
include = ["platform_core*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) in defaults is the FastAPI idiom

[tool.importlinter]
root_packages = ["platform_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Platform must not depend on apps"
type = "forbidden"
source_modules = ["platform_core"]
forbidden_modules = ["apps", "kyc_app"]
