name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Import boundaries
        run: lint-imports

  platform-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  kyc-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kyc/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e "../../../platform/backend" && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Import boundaries
        run: lint-imports
      - name: Tests
        run: pytest -q

  kyc-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kyc/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/kyc/frontend/package-lock.json
      - name: Install platform frontend deps (typechecked as source via @platform)
        run: npm ci
        working-directory: platform/frontend
      - run: npm ci
      - name: Lint (incl. boundary rules)
        run: npx eslint .
      - name: Typecheck + build
        run: npm run build
