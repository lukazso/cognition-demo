[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-app"
version = "0.1.0"
description = "KYC review queue - reference app on the internal tools platform"
requires-python = ">=3.10"
dependencies = [
    "platform-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
    "import-linter>=2",
]

[tool.setuptools.packages.find]
include = ["kyc_app*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) in defaults is the FastAPI idiom

[tool.importlinter]
root_packages = ["kyc_app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "App must not access data sources or HTTP clients directly"
type = "forbidden"
source_modules = ["kyc_app"]
forbidden_modules = ["sqlite3", "httpx", "requests", "urllib", "aiohttp", "sqlalchemy"]
allow_indirect_imports = "true"  # the app may use platform_core, which owns the DB
