[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-tools-poc"
version = "0.1.0"
description = "POC: internal tools platform (governed actions, connectors, repeatable delivery)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) in defaults is the FastAPI idiom

[tool.pytest.ini_options]
testpaths = ["apps", "platform"]

[tool.importlinter]
root_packages = ["platform_core", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Platform must not depend on apps"
type = "forbidden"
source_modules = ["platform_core"]
forbidden_modules = ["apps"]

[[tool.importlinter.contracts]]
name = "Apps must be independent of each other"
type = "independence"
modules = ["apps.kyc"]

[[tool.importlinter.contracts]]
name = "Apps must not access data sources or HTTP clients directly"
type = "forbidden"
source_modules = ["apps"]
forbidden_modules = ["sqlite3", "httpx", "requests", "urllib", "aiohttp", "sqlalchemy"]
allow_indirect_imports = "true"  # apps may use platform_core, which owns the DB
